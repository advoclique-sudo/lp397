<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#163d31">
  <meta name="description" content="NutriViva: nutricionistas e pacientes conectados em uma rotina mais saudável.">
  <title>NutriViva · Demonstração local</title>
  <style>
:root {
  --bg:#f7f8fa;
  --paper:#fff;
  --ink:#1d332b;
  --muted:#8b9691;
  --green:#163d31;
  --green-2:#2c6350;
  --lime:#d7ef96;
  --line:#e9eeeb;
  --soft:#f3f7f1;
  --danger:#b94b4b;
  --shadow:0 5px 22px rgba(22,61,49,.025);
  font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color:var(--ink);
  font-synthesis:none;
  text-rendering:optimizeLegibility;
  -webkit-font-smoothing:antialiased;
  font-weight:400
}

* {
  box-sizing:border-box
}

body {
  margin:0;
  background:var(--bg);
  font-size:14px;
  line-height:1.5
}

button,input,select,textarea {
  font:inherit
}

button,a,input,textarea,select {
  -webkit-tap-highlight-color:transparent
}

button,a {
  touch-action:manipulation
}

button {
  cursor:pointer
}

button:disabled {
  cursor:wait;
  opacity:.6
}

button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible {
  outline:3px solid #afca6a;
  outline-offset:3px
}

a {
  color:inherit
}

h1,h2,h3,p {
  margin:0
}

h1,h2,h3 {
  line-height:1.25
}

svg {
  width:20px;
  height:20px;
  fill:none;
  stroke:currentColor;
  stroke-width:1.7;
  stroke-linecap:round;
  stroke-linejoin:round;
  flex-shrink:0
}

button {
  border:0
}

input,textarea,select {
  min-width:0
}

textarea {
  resize:vertical
}

::selection {
  background:var(--lime);
  color:var(--green)
}

[hidden] {
  display:none!important
}

.app-shell {
  min-height:100vh;
  padding-left:238px
}

.sidebar {
  width:238px;
  background:var(--green);
  color:#c1d0c8;
  position:fixed;
  left:0;
  top:0;
  bottom:0;
  display:flex;
  flex-direction:column;
  padding:38px 20px 20px;
  z-index:40
}

.brand {
  display:flex;
  align-items:center;
  gap:10px;
  padding:0 15px;
  color:#fff;
  font-size:24px;
  font-weight:650;
  letter-spacing:-1.2px;
  text-decoration:none
}

.brand-mark {
  color:var(--lime);
  display:grid;
  place-items:center
}

.brand-mark svg {
  width:29px;
  height:29px;
  stroke-width:1.8
}

.brand span:last-child em {
  font-style:normal;
  color:var(--lime)
}

.nav-links {
  display:grid;
  gap:9px;
  margin-top:57px
}

.nav-link {

  align-items:center;
  gap:13px;
  padding:14px 16px;
  border-radius:10px;
  color:#b8cdc1;

  background:transparent;
  width:100%;
  text-align:left;
  font-weight:500;
  font-size:13px;
  transition:background .18s,color .18s
}

.nav-link svg {
  width:19px;
  height:19px
}

.nav-link:hover {
  background:#244a3d;
  color:#fff
}

.nav-link.active {
  background:var(--lime);
  color:var(--green);
  font-weight:650
}

.nav-icon {
  display:flex;
  align-items:center
}

.sidebar-bottom {
  margin-top:auto;
  padding:24px 10px 0
}

.sidebar-tip {
  padding:18px 17px;
  background:#214839;
  border:1px solid #355747;
  border-radius:14px;
  color:#c9d8cd;
  margin-bottom:27px;
  font-size:11px;
  line-height:1.6
}

.sidebar-tip svg {
  color:var(--lime);
  margin-bottom:9px
}

.sidebar-tip strong {
  color:#fff;
  display:block;
  font-size:13px;
  margin-bottom:6px
}

.profile-row {
  display:flex;
  align-items:center;
  gap:10px;
  padding-top:22px;
  border-top:1px solid #345446
}

.profile-avatar,.profile-small {
  width:37px;
  height:37px;
  border-radius:50%;

  place-items:center;
  background:#d9e8bf;
  color:var(--green);

  flex-shrink:0;

}

.profile-details {

  flex:1
}

.profile-details strong {

  color:#fff;
  font-size:12px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap
}

.profile-details small {
  display:block;
  font-size:10px;
  color:#94b3a1;
  margin-top:3px
}

.logout {

  height:32px;
  background:none;
  color:#a9bfaf;
  display:grid;
  place-items:center
}

.logout:hover {
  color:#fff
}

.logout svg {
  width:17px;
  height:17px
}

.main-content {
  max-width:1580px;
  margin:0 auto;
  padding:31px 42px 40px
}

.topbar {
  display:flex;
  justify-content:space-between;
  align-items:center;
  min-height:42px;
  margin-bottom:36px
}

.topbar-date {
  color:#8d9793;
  font-size:12px;
  display:flex;
  gap:9px;
  align-items:center
}

.topbar-date svg {
  width:15px;
  height:15px;
  color:#8d9e92
}

.topbar-date:first-letter {
  text-transform:uppercase
}

.topbar-tools {
  display:flex;
  align-items:center;
  gap:16px
}

.icon-button {
  width:34px;
  height:34px;
  display:inline-grid;
  place-items:center;
  background:transparent;
  border:1px solid transparent;
  border-radius:8px;
  color:#7a8980
}

.icon-button:hover {
  background:#edf1ec
}

.profile-small {
  width:34px;
  height:34px;
  font-size:11px;
  border:3px solid white;
  box-shadow:0 0 0 1px var(--line);
  background:#f0e0ce
}

.mobile-menu,.mobile-brand {
  display:none
}

.page-heading {
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:25px;
  margin-bottom:29px
}

.eyebrow {
  font-size:11px;
  font-weight:600;
  letter-spacing:.03em;
  color:#819286;
  margin-bottom:9px
}

.page-heading h1 {
  font-size:29px;
  letter-spacing:-1.15px;
  font-weight:620;
  margin-bottom:10px
}

.page-heading p {
  font-size:12px;
  color:#8a9690
}

.page-actions {
  display:flex;
  align-items:center;
  gap:10px;
  flex-shrink:0
}

.button {
  border-radius:9px;
  min-height:43px;
  padding:11px 17px;
  display:inline-flex;
  gap:9px;
  align-items:center;
  justify-content:center;
  text-decoration:none;
  font-size:12px;
  font-weight:600;
  white-space:nowrap;
  border:1px solid transparent;
  transition:background .18s,transform .18s
}

.button:hover {
  transform:translateY(-1px)
}

.button svg {
  width:16px;
  height:16px
}

.button.primary {
  background:var(--green);
  color:white;
  box-shadow:0 3px 5px rgba(22,61,49,.06)
}

.button.primary:hover {
  background:#225340
}

.button.secondary {
  background:white;
  border-color:var(--line);
  color:#61766a
}

.button.secondary:hover {
  border-color:#b8cbb9;
  background:#fbfdf9
}

.button.ghost {
  background:transparent;
  color:#557664;
  border-color:#dce6dd
}

.button.small {
  min-height:33px;
  font-size:11px;
  padding:7px 11px
}

.button.danger {
  color:var(--danger);
  background:#fff2f0;
  border-color:#f7dfdc
}

.button.wide {
  width:100%
}

  display:flex;
  align-items:center;
  gap:9px;
  background:#eff4e5;
  border:1px solid #e5edd6;
  border-radius:9px;
  padding:10px 14px;
  margin-bottom:22px;
  color:#74875a;
  font-size:11px
}

.demo-banner svg {
  width:15px;
  height:15px
}

.demo-banner span {
  flex:1
}

.demo-banner button {

  color:var(--green);

  font-weight:600;
  display:flex;
  align-items:center;
  gap:7px;
  padding:0
}

.stats-grid {
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:18px;
  margin-bottom:27px
}

.stat-card {
  position:relative;
  background:#fff;
  border:1px solid var(--line);
  border-radius:15px;
  padding:21px 23px 18px;
  box-shadow:var(--shadow);
  min-height:149px;
  overflow:hidden
}

.stat-top {
  display:flex;
  align-items:center;
  gap:11px;
  margin-bottom:12px
}

.stat-icon {
  width:35px;
  height:35px;

  place-items:center;
  border-radius:10px;
  background:#eef5e8;
  color:#729f50;

}

.stat-icon svg {
  width:18px;
  height:18px
}

.stat-card:nth-child(2) .stat-icon {

  color:#c79c5a
}

.stat-card:nth-child(3) .stat-icon {
  background:#f1effb;
  color:#9384bc
}

.stat-copy {
  font-size:11px;
  color:#8a9690;
  font-weight:450
}

.stat-value {
  font-size:31px;
  letter-spacing:-1.4px;
  font-weight:620;
  color:#243a2e;
  line-height:1.2;
  margin-top:7px
}

.stat-value small {
  font-size:13px;
  font-weight:400;
  letter-spacing:0;
  color:#9ca79f;
  margin-left:5px
}

.stat-footer {
  display:flex;
  align-items:center;
  gap:6px;
  color:#a0aaa5;
  font-size:10px;
  margin-top:13px
}

.stat-trend {
  color:#719657;
  display:inline-flex;
  align-items:center;
  gap:2px
}

.stat-trend svg {
  width:12px;
  height:12px
}

.sparkline {
  position:absolute;
  right:20px;
  bottom:24px;
  width:90px;
  height:32px;
  color:#bad29c
}

.sparkline svg {
  width:90px;
  height:32px;
  stroke-width:2
}

.content-grid {
  display:grid;
  grid-template-columns:minmax(270px, .77fr) minmax(0,1.65fr);
  gap:24px;
  align-items:start
}

.panel {
  background:#fff;
  border:1px solid var(--line);
  border-radius:15px;
  box-shadow:var(--shadow);
  overflow:hidden
}

.panel-heading {
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:13px;
  padding:23px 22px 18px
}

.panel-heading svg {
  width:17px;
  height:17px;
  color:#91a094
}

.panel-title {
  font-size:14px;
  letter-spacing:-.2px;
  font-weight:600
}

.subtle {
  font-size:11px;
  color:#99a39d;
  margin-top:6px;
  line-height:1.6
}

.text-button {
  background:none;
  color:#557c60;
  font-size:11px;
  font-weight:600;

  display:inline-flex;
  gap:5px;
  align-items:center
}

.text-button:hover {
  color:#173f2e
}

.text-button svg {
  width:13px;
  height:13px
}

.search-field {
  position:relative;
  margin:0 20px 17px
}

.search-field svg {
  position:absolute;
  left:12px;
  top:11px;
  width:15px;
  height:15px;
  color:#9aa69e
}

.search-field input {
  background:#f8faf8;
  border:1px solid #eef1ec;
  border-radius:8px;
  padding:10px 11px 10px 35px;
  width:100%;
  font-size:11px;
  color:#536d5a
}

.search-field input::placeholder {
  color:#a3ada6
}

.patient-list {
  display:grid;
  gap:5px;
  padding:0 12px 14px
}

.patient-row {
  position:relative;
  background:transparent;
  width:100%;
  display:flex;
  align-items:center;
  gap:11px;
  border-radius:9px;
  padding:15px 11px;
  text-align:left;
  color:inherit;
  transition:background .18s;
  border:1px solid transparent
}

.patient-row:hover {
  background:#f7faf4
}

.patient-row.selected {
  background:#f1f6e9;
  border-color:#e6edda
}

.avatar {
  width:40px;
  height:40px;
  border-radius:50%;
  background:#e8ede0;
  color:#6d8052;
  font-size:12px;
  font-weight:650;
  display:grid;
  place-items:center;
  flex-shrink:0
}

.avatar.lilac,.avatar.color-1 {

  color:#8c7ba2
}

.avatar.peach,.avatar.color-2 {

  color:#a27b62
}

.avatar.green,.avatar.color-0 {

  color:#73885c
}

.patient-info {
  flex:1;

}

.patient-info strong {

}

.patient-info small {

}

.mini-progress {
  height:4px;
  background:#e7eede;
  border-radius:4px;

}

.mini-progress span {
  height:100%;

}

.patient-pct {

  font-weight:600;
  color:#78965c;

}

.patient-pct small {
  display:block;
  font-size:9px;
  font-weight:400;
  color:#a0aca0;
  margin-top:3px
}

.panel-footer {
  border-top:1px solid var(--line);
  padding:16px 20px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#8ba079;
  font-size:11px
}

.panel-footer svg {
  width:14px;
  height:14px;
  margin-right:7px
}

.panel-footer button {

  justify-content:center
}

.diary-header {

.diary-user {

}

.diary-avatar {

.diary-user h2 {

.diary-user p {

}

.date-controls {

  gap:4px
}

.date-controls .icon-button {

}

.date-controls .icon-button svg {

  height:14px
}

.date-controls input[type=date] {

.date-label {

  margin-right:4px
}

.daily-summary {

.progress-ring {
  --progress:0%;
  width:70px;
  height:70px;

.ring-inner {
  width:58px;
  height:58px;

}

.ring-inner strong {

}

.ring-inner small {

}

.summary-detail h3 {
  font-size:12px;
  font-weight:600;
  margin-bottom:5px
}

.summary-detail p {

.goal-tag {

.meal-symbol svg {

.meal-card:nth-child(3) .meal-symbol {

.meal-card:nth-child(4) .meal-symbol {

.meal-card:nth-child(5) .meal-symbol {

.overlay {

  inset:0;
  background:rgba(9,31,22,.36);
  backdrop-filter:blur(4px);
  z-index:70;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
  animation:fadeIn .15s ease

.modal {
  width:100%;
  max-width:480px;
  background:#fff;
  border-radius:18px;
  box-shadow:0 25px 100px rgba(9,31,22,.2);
  max-height:calc(100dvh - 48px);

  display:flex;

  justify-content:space-between;
  gap:20px;

  font-size:12px;
  color:#92a08f;
  margin-top:8px
}

  background:#f6f8f3;
  border:1px solid #edf0e8;
  border-radius:8px;
  color:#7d8e79;

  height:29px;
  display:grid;
  place-items:center;
  flex-shrink:0
}

.close-modal svg {
  width:16px;
  height:16px
}

.modal-body {
  padding:0 27px 24px
}

.modal-footer {

  align-items:center;
  justify-content:flex-end;
  gap:10px
}

.form-stack {
  display:grid;
  gap:17px
}

  display:grid;
  gap:7px
}

  font-weight:600;
  color:#5d735e
}

  background:#fff;
  border-radius:8px;

  padding:11px 12px;
  color:#2e4a36;
  width:100%;
  font-size:12px;
  transition:border-color .18s
}

  color:#a5aea1
}

.form-field input:focus,.form-field textarea:focus,.form-field select:focus {
  border-color:#9ab97c
}

.form-field textarea {
  min-height:88px
}

.hint {
  color:#9ba591;
  font-size:10px;
  line-height:1.7
}

.form-error {

  font-size:11px;

}

}

}

.note-form {

  gap:14px
}

.toast {
  position:fixed;
  bottom:25px;
  left:calc(50% + 119px);
  transform:translate(-50%,20px);
  background:#163d31;
  color:#f4f9ed;
  border:1px solid #47634c;
  padding:12px 20px;
  border-radius:10px;
  box-shadow:0 8px 35px #163d3125;
  font-size:12px;
  z-index:100;
  opacity:0;
  pointer-events:none;
  transition:opacity .2s,transform .2s;
  max-width:calc(100% - 40px);
  text-align:center
}

.toast.visible {
  opacity:1;
  transform:translate(-50%,0)
}

@keyframes fadeIn {
  from {
    opacity:0
  }
  to {
    opacity:1
  }
}

<body>
<aside id="local-demo-warning" class="local-demo-warning" role="note"><strong>Demonstração local</strong><span>· Dados ficam neste navegador. Sem sincronização com outros dispositivos.</span><small>Use somente dados fictícios. Este arquivo não cria contas reais e não envia informações pela internet.</small></aside>
  <div id="app"><div class="loading" role="status">Preparando seu espaço…</div></div>
  <div id="modal-root"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script>

(() => {
  'use strict';
  const key = 'nutriviva.offline-demo.v1';
  const localDay = () => new Intl.DateTimeFormat('en-CA', {
    timeZone: 'America/Sao_Paulo', year: 'numeric', month: '2-digit', day: '2-digit'
  }).format(new Date());
  const clone = value => JSON.parse(JSON.stringify(value));
  function seed() {
    const users = [
      {id: 1, name: 'Clara Mendes', email: 'clara@exemplo.invalid', role: 'nutritionist', is_demo: true},
      {id: 2, name: 'Ana Oliveira', email: 'ana@exemplo.invalid', role: 'patient', is_demo: true},
      {id: 3, name: 'Lucas Almeida', email: 'lucas@exemplo.invalid', role: 'patient', is_demo: true},
      {id: 4, name: 'Marina Costa', email: 'marina@exemplo.invalid', role: 'patient', is_demo: true}
    ];
    const templates = [
      ['Café da manhã', '07:00', '1 iogurte natural + 2 colheres de aveia + 1 banana.'],
      ['Lanche da manhã', '10:00', '1 fruta da estação e um punhado de castanhas.'],
      ['Almoço', '12:30', 'Arroz integral, feijão, frango grelhado e salada colorida.'],
      ['Lanche da tarde', '15:30', '1 sanduíche de pão integral com queijo branco.'],
      ['Jantar', '19:30', 'Omelete com legumes e salada de folhas.']
    ];
    const patients = users.slice(1).map((user, index) => ({
      id: index + 1, owner_id: 1, user_id: user.id, name: user.name, email: user.email,
      goal: ['Construir uma rotina alimentar mais equilibrada.', 'Ter mais disposição no dia a dia.', 'Cuidar da alimentação com leveza e consistência.'][index],
      created_at: new Date().toISOString(),
      meals: templates.map(([name, time, description], mealIndex) => ({
        id: index * 5 + mealIndex + 1, name, time, description
      }))
    }));
    const checks = {};
    patients.forEach((patient, index) => patient.meals.forEach((meal, mealIndex) => {
      if (mealIndex < [3, 2, 4][index]) checks[`${meal.id}:${localDay()}`] = {
        done: true, note: mealIndex === 2 ? 'Segui o planejamento e me senti bem.' : '',
        checked_at: new Date().toISOString()
      };
    }));
    return {users, patients, checks, invites: {}, session: 1, nextUser: 5, nextPatient: 4, nextMeal: 16};
  }
  let db;
  let persistent = true;
  try { db = JSON.parse(localStorage.getItem(key)); } catch (_) { persistent = false; }
  if (!db || !Array.isArray(db.users) || !Array.isArray(db.patients)) db = seed();
  function save() {
    try { localStorage.setItem(key, JSON.stringify(db)); }
    catch (_) { persistent = false; }
    const warning = document.getElementById('local-demo-warning');
    if (warning) warning.dataset.persistent = String(persistent);
  }
  save();
  const response = (value, status = 200) => Promise.resolve(new Response(JSON.stringify(clone(value)), {
    status, headers: {'Content-Type': 'application/json'}
  }));
  const fail = (message, status = 400) => response({error: message}, status);
  function user() { return db.users.find(item => item.id === db.session) || null; }
  function owner(current) {
    if (current.role === 'nutritionist') return current.id;
    return db.patients.find(patient => patient.user_id === current.id)?.owner_id;
  }
  function patientData(patient, date) {
    const meals = patient.meals.slice().sort((a, b) => a.time.localeCompare(b.time)).map(meal => ({
      ...meal, done: false, note: '', checked_at: null, ...db.checks[`${meal.id}:${date}`]
    }));
    return {...patient, has_access: !!patient.user_id, meals,
      progress: {completed: meals.filter(meal => meal.done).length, total: meals.length}};
  }
  function inviteURL(token) {
    const url = new URL(location.href);
    url.search = ''; url.hash = ''; url.searchParams.set('invite', token);
    return url.href;
  }
  function createInvite(patient) {
    Object.keys(db.invites).forEach(token => {
      if (db.invites[token] === patient.id) delete db.invites[token];
    });
    const token = 'local-' + Math.random().toString(36).slice(2) + Date.now().toString(36);
    db.invites[token] = patient.id;
    save();
    return inviteURL(token);
  }
  // No request in this file reaches a network. This is a visual prototype, not authentication.
  window.fetch = async (input, options = {}) => {
    const url = new URL(String(input), 'https://local-demo.invalid');
    const path = url.pathname;
    const method = options.method || 'GET';
    let body = {};
    try { body = options.body ? JSON.parse(options.body) : {}; }
    catch (_) { return fail('Dados inválidos para a demonstração.'); }
    const current = user();
    if (path === '/api/me') return response({user: current});
    if (path === '/api/logout') { db.session = null; save(); return response({ok: true}); }
    if (path === '/api/demo') {
      db.session = body.role === 'patient' ? 2 : 1; save(); return response({user: user()});
    }
    if (path === '/api/login') {
      const found = db.users.find(item => item.email.toLowerCase() === String(body.email).toLowerCase());
      if (!found) return fail('Na demonstração, use o botão Conhecer demonstração. Nenhuma conta real é acessada.');
      db.session = found.id; save(); return response({user: found});
    }
    if (path === '/api/register') {
      const account = {id: db.nextUser++, name: String(body.name || 'Nutricionista de exemplo'),
        email: String(body.email || 'nutri@exemplo.invalid'), role: 'nutritionist', is_demo: true};
      db.users.push(account); db.session = account.id; save(); return response({user: account});
    }
    const invitation = path.match(/^\/api\/invites\/([^/]+)(\/accept)?$/);
    if (invitation) {
      const patient = db.patients.find(item => item.id === db.invites[decodeURIComponent(invitation[1])]);
      if (!patient) return fail('Este convite local já foi utilizado ou não existe neste navegador.', 404);
      if (invitation[2]) {
        const account = {id: db.nextUser++, name: patient.name, email: patient.email, role: 'patient', is_demo: true};
        db.users.push(account); patient.user_id = account.id; db.session = account.id;
        delete db.invites[invitation[1]]; save(); return response({user: account});
      }
      return response({patient: {name: patient.name, email: patient.email},
        nutritionist_name: db.users.find(item => item.id === patient.owner_id)?.name || 'Nutricionista de exemplo'});
    }
    if (!current) return fail('Abra a demonstração para continuar.', 401);
    if (path === '/api/dashboard') {
      const date = url.searchParams.get('date') || localDay();
      const patients = db.patients.filter(patient => current.role === 'patient' ? patient.user_id === current.id : patient.owner_id === current.id).map(patient => patientData(patient, date));
      const completed = patients.reduce((sum, patient) => sum + patient.progress.completed, 0);
      const total = patients.reduce((sum, patient) => sum + patient.progress.total, 0);
      return response({user: current, date, patients,
        summary: {patients: patients.length, completed, total, adherence: total ? Math.round(completed / total * 100) : 0}});
    }
    if (path === '/api/patients' && method === 'POST' && current.role === 'nutritionist') {
      const patient = {id: db.nextPatient++, owner_id: current.id, user_id: null,
        name: String(body.name), email: String(body.email), goal: String(body.goal || ''),
        created_at: new Date().toISOString(), meals: []};
      db.patients.push(patient);
      return response({patient: patientData(patient, localDay()), invite_url: createInvite(patient)});
    }
    const patientRoute = path.match(/^\/api\/patients\/(\d+)\/(invite|meals)$/);
    if (patientRoute && current.role === 'nutritionist') {
      const patient = db.patients.find(item => item.id === Number(patientRoute[1]) && item.owner_id === current.id);
      if (!patient) return fail('Paciente não encontrado nesta demonstração.', 404);
      if (patientRoute[2] === 'invite') {
        if (patient.user_id) return fail('Este paciente de exemplo já tem acesso.', 409);
        return response({invite_url: createInvite(patient)});
      }
      const meal = {id: db.nextMeal++, name: String(body.name), time: String(body.time), description: String(body.description || '')};
      patient.meals.push(meal); save(); return response({meal});
    }
    const mealRoute = path.match(/^\/api\/meals\/(\d+)(\/check)?$/);
    if (mealRoute) {
      const patient = db.patients.find(item => item.meals.some(meal => meal.id === Number(mealRoute[1])));
      if (!patient || (current.role === 'patient' ? patient.user_id !== current.id : patient.owner_id !== current.id)) return fail('Refeição não encontrada.', 404);
      if (method === 'DELETE' && !mealRoute[2] && current.role === 'nutritionist') {
        patient.meals = patient.meals.filter(meal => meal.id !== Number(mealRoute[1]));
        Object.keys(db.checks).filter(key => key.startsWith(mealRoute[1] + ':')).forEach(key => delete db.checks[key]);
        save(); return response({ok: true});
      }
      if (mealRoute[2] && method === 'POST') {
        const date = body.date || localDay();
        if (date > localDay()) return fail('Escolha hoje ou um dia anterior para registrar a refeição.');
        db.checks[`${mealRoute[1]}:${date}`] = {done: !!body.done, note: String(body.note || ''), checked_at: body.done ? new Date().toISOString() : null};
        save(); return response({ok: true});
      }
    }
    return fail('Esta ação não está disponível na demonstração local.', 404);
  };
  window.addEventListener('DOMContentLoaded', () => {
    const warning = document.getElementById('local-demo-warning');
    if (warning) warning.dataset.persistent = String(persistent);
  });
})();

function renderMeal(meal,index,plan) {
  const symbols=['coffee','sun','meal','leaf','moon']; const done=meal.done;
  return `<article class="meal-card ${done?'completed':''}" data-meal="${meal.id}"><div class="meal-time">${esc(meal.time)}</div><span class="meal-symbol">${icon(symbols[index%symbols.length])}</span><div class="meal-content"><div class="meal-title"><h3>${esc(meal.name)}</h3><span class="meal-status ${done?'done':''}">${done?`${icon('check')} Registrada`:'A registrar'}</span></div><p>${esc(meal.description||'Siga as orientações do seu nutricionista.')}</p>${meal.note?`<div class="meal-note">${icon('message')}<span>${esc(meal.note)}</span></div>`:''}<div class="meal-actions"><button class="text-button note-button" data-action="note" data-id="${meal.id}">${icon('message')} ${meal.note?'Editar observação':'Adicionar observação'}</button>${plan&&!patientRole()?`<button class="text-button danger-text" data-action="delete-meal" data-id="${meal.id}">${icon('trash')} Excluir</button>`:''}</div></div><button class="meal-check ${done?'checked':''}" data-action="check" data-id="${meal.id}" aria-label="${done?'Desmarcar':'Registrar'} ${esc(meal.name)}" aria-pressed="${done}">${icon('check')}</button></article>`;
}
function renderPatients() {
  const patients=state.data.patients;
  return `<section class="patients-grid">${patients.map((p,i)=>`<article class="panel patient-card"><div class="patient-card-top">${avatar(p.name,i)}<span class="badge">Paciente</span></div><h2>${esc(p.name)}</h2><p class="patient-email">${esc(p.email)}</p><p class="patient-card-goal">${esc(p.goal||'Construindo uma rotina mais saudável.')}</p><div class="patient-card-progress"><span>Registros de hoje</span><strong>${percentage(p)}%</strong></div><div class="mini-progress"><span style="width:${percentage(p)}%"></span></div><div class="patient-card-actions"><button class="button secondary small" data-action="patient-plan" data-id="${p.id}">Ver plano ${icon('arrow')}</button>${!p.has_access?`<button class="icon-button" data-action="invite" data-id="${p.id}" title="Gerar convite" aria-label="Gerar convite para ${esc(p.name)}">${icon('link')}</button>`:''}</div></article>`).join('')}<button class="new-patient-card" data-action="add-patient"><span>${icon('plus')}</span><strong>Novo paciente</strong><p>Uma nova história para acompanhar.</p></button></section>`;
}
async function loadDashboard() { await refreshDashboard(true); }
async function refreshDashboard(full=false) {
  const request=++dashboardRequest;
  try { const result=await api(`/dashboard?date=${encodeURIComponent(state.date)}`);if(request!==dashboardRequest)return;state.data=result;state.user=result.user||state.user;if(!result.patients.some(p=>p.id===state.selected))state.selected=result.patients[0]?.id||null;full?renderShell():renderContent(); }
  catch(error) {toast(errorMessage(error));if(!state.data) { document.getElementById('app').innerHTML=`<div class="empty-state large"><h2>Não foi possível carregar seu espaço.</h2><p>${esc(errorMessage(error))}</p><button class="button primary" data-action="retry">Tentar novamente</button></div>`;}throw error;}
}
function closeModal() { document.getElementById('modal-root').innerHTML='';document.body.classList.remove('modal-open'); }
function modal(title,body,footer='') {
  document.getElementById('modal-root').innerHTML=`<div class="overlay" data-action="overlay-close"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><header class="modal-header"><h2 id="modal-title">${esc(title)}</h2><button class="icon-button close-modal" data-action="close-modal" aria-label="Fechar">${icon('close')}</button></header><div class="modal-body">${body}</div>${footer?`<footer class="modal-footer">${footer}</footer>`:''}</section></div>`;document.body.classList.add('modal-open');setTimeout(()=>document.querySelector('.modal input, .modal textarea, .modal button')?.focus(),10);
}
function formError(error) { const el=document.getElementById('modal-error');if(el)el.textContent=errorMessage(error);else toast(errorMessage(error)); }
function inviteModal(url) {
  const absolute=new URL(url,location.href).href;
  modal('Um convite para cuidar de perto',`<div class="invite-success">${icon('link')}</div><p>Este convite funciona apenas nesta demonstração, no mesmo navegador. Não libera acesso em outros dispositivos.</p>${state.user.is_demo?'<p class="hint demo-hint">Este convite pertence à demonstração. Use apenas dados fictícios.</p>':''}<div class="form-field"><label for="invite-link">Link de acesso pessoal</label><input id="invite-link" value="${esc(absolute)}" readonly></div><p class="hint">Use apenas nomes e e-mails fictícios. A senha é apenas ilustrativa e não é armazenada nem verificada.</p>`,`<button class="button secondary" data-action="close-modal">Concluir</button><button class="button primary" data-action="copy-invite">${icon('copy')} Copiar convite</button>`);
}
function addPatientModal() {
  modal('Novo paciente',`<p class="modal-intro">O primeiro passo de uma rotina mais conectada.</p><form id="patient-form" class="form-stack"><div class="form-field"><label for="patient-name">Nome completo</label><input id="patient-name" name="name" placeholder="Nome do paciente" required maxlength="100"></div><div class="form-field"><label for="patient-email">E-mail de acesso</label><input id="patient-email" name="email" type="email" placeholder="paciente@exemplo.com" required maxlength="254"></div><div class="form-field"><label for="patient-goal">Objetivo do acompanhamento <span>(opcional)</span></label><textarea id="patient-goal" name="goal" rows="3" placeholder="Ex.: Construir uma relação mais leve com a alimentação" maxlength="500"></textarea></div><p id="modal-error" class="form-error" role="alert"></p><button class="button primary" type="submit">Adicionar e gerar convite ${icon('arrow')}</button></form>`);
  document.getElementById('patient-form').addEventListener('submit',async e=>{e.preventDefault();const button=e.currentTarget.querySelector('button');button.disabled=true;try{const result=await api('/patients',Object.fromEntries(new FormData(e.currentTarget)));state.selected=result.patient.id;await refreshDashboard(true);inviteModal(result.invite_url);toast('Paciente adicionado. Compartilhe o convite para liberar o acesso.');}catch(error){formError(error);button.disabled=false;}});
}
function addMealModal(id) {
  modal('Adicionar refeição',`<p class="modal-intro">Uma orientação clara faz toda a diferença na rotina.</p><form id="meal-form" class="form-stack"><div class="form-row"><div class="form-field"><label for="meal-name">Nome da refeição</label><input id="meal-name" name="name" placeholder="Ex.: Café da manhã" required maxlength="100"></div><div class="form-field time-field"><label for="meal-time">Horário</label><input id="meal-time" name="time" type="time" value="08:00" required></div></div><div class="form-field"><label for="meal-description">Orientações</label><textarea id="meal-description" name="description" rows="4" placeholder="Alimentos, opções e orientações para o paciente…" maxlength="2000"></textarea></div><p class="hint">Esta refeição fará parte do plano diário do paciente.</p><p id="modal-error" class="form-error" role="alert"></p><button class="button primary" type="submit">${icon('plus')} Adicionar ao plano</button></form>`);
  document.getElementById('meal-form').addEventListener('submit',async e=>{e.preventDefault();const button=e.currentTarget.querySelector('button');button.disabled=true;try{await api(`/patients/${id}/meals`,Object.fromEntries(new FormData(e.currentTarget)));closeModal();await refreshDashboard();toast('Refeição adicionada ao plano.');}catch(error){formError(error);button.disabled=false;}});
}
function mealById(id) { return state.data.patients.flatMap(p=>p.meals).find(m=>String(m.id)===String(id)); }
function noteModal(id) {
  const meal=mealById(id);if(!meal)return;
  modal(`Como foi ${meal.name.toLowerCase()}?`,`<p class="modal-intro">${patientRole()?'Conte como foi sua refeição. Você pode alternar a visão para conferir o registro local.':'Registre uma observação sobre esta refeição.'}</p><form id="note-form" class="form-stack"><div class="form-field"><label for="meal-note">Observação do dia</label><textarea id="meal-note" name="note" rows="5" maxlength="1000" placeholder="Ex.: Troquei a fruta por uma opção que tinha em casa.">${esc(meal.note||'')}</textarea></div><p class="hint">A observação será salva em ${prettyDate(state.date)}.</p><p id="modal-error" class="form-error" role="alert"></p><button class="button primary" type="submit">Salvar observação ${icon('check')}</button></form>`);
  document.getElementById('note-form').addEventListener('submit',async e=>{e.preventDefault();const button=e.currentTarget.querySelector('button');button.disabled=true;try{await api(`/meals/${id}/check`,{date:state.date,done:!!meal.done,note:new FormData(e.currentTarget).get('note')});closeModal();await refreshDashboard();toast('Observação salva.');}catch(error){formError(error);button.disabled=false;}});
}
async function changeDate(amount) { const d=dateObject(state.date);d.setUTCDate(d.getUTCDate()+amount);const value=d.toISOString().slice(0,10);if(value>today())return;state.date=value;await refreshDashboard(); }

document.addEventListener('click',async event=>{
  const button=event.target.closest('[data-action]');if(!button)return;const action=button.dataset.action;if(button.disabled)return;
  if(action==='overlay-close'&&event.target!==button)return;
  try {
    switch(action){
      case 'auth-mode':state.authMode=button.dataset.mode;renderAuth();break;
      case 'home':event.preventDefault();state.view='overview';renderShell();break;
      case 'demo':button.disabled=true;state.user=(await api('/demo',{role:'nutritionist'})).user;state.view='overview';await loadDashboard();break;
      case 'switch-role':button.disabled=true;state.user=(await api('/demo',{role:patientRole()?'nutritionist':'patient'})).user;state.view='overview';state.selected=null;await loadDashboard();break;
      case 'logout':await api('/logout',{});state.authMode='login';state.user=null;state.data=null;state.view='overview';state.selected=null;document.body.classList.remove('menu-open');renderAuth();break;
      case 'navigate':state.view=button.dataset.view;document.body.classList.remove('menu-open');renderShell();break;
      case 'select-patient':state.selected=state.data.patients.find(p=>String(p.id)===button.dataset.id)?.id;renderContent();break;
      case 'patient-plan':state.selected=state.data.patients.find(p=>String(p.id)===button.dataset.id)?.id;state.view='plan';renderShell();break;
      case 'add-patient':addPatientModal();break;
      case 'add-meal':addMealModal(button.dataset.id);break;
      case 'invite':button.disabled=true;inviteModal((await api(`/patients/${button.dataset.id}/invite`,{})).invite_url);button.disabled=false;break;
      case 'copy-invite':{const input=document.getElementById('invite-link');try{await navigator.clipboard.writeText(input.value);toast('Convite copiado. Compartilhe com seu paciente.');}catch{input.focus();input.select();toast('Selecione e copie o link de convite.');}break;}
      case 'check':{const meal=mealById(button.dataset.id);button.disabled=true;await api(`/meals/${meal.id}/check`,{date:state.date,done:!meal.done,note:meal.note||''});await refreshDashboard();toast(meal.done?'Registro desmarcado.':'Refeição registrada. Mais um passo no seu cuidado!');break;}
      case 'note':noteModal(button.dataset.id);break;
      case 'delete-meal':{const meal=mealById(button.dataset.id);modal('Remover refeição do plano?',`<p>A refeição <strong>${esc(meal.name)}</strong> será removida do plano, junto com seus registros. Esta ação não pode ser desfeita.</p>`,`<button class="button secondary" data-action="close-modal">Cancelar</button><button class="button danger" data-action="confirm-delete" data-id="${meal.id}">Remover refeição</button>`);break;}
      case 'confirm-delete':button.disabled=true;await api(`/meals/${button.dataset.id}`,undefined,'DELETE');closeModal();await refreshDashboard();toast('Refeição removida do plano.');break;
      case 'date-prev':await changeDate(-1);break;
      case 'date-next':await changeDate(1);break;
      case 'close-modal':case 'overlay-close':closeModal();break;
      case 'menu':document.body.classList.add('menu-open');break;
      case 'close-menu':document.body.classList.remove('menu-open');break;
      case 'retry':await loadDashboard();break;
    }
  }catch(error){toast(errorMessage(error));button.disabled=false;}
});
document.addEventListener('keydown',event=>{if(event.key==='Escape'){closeModal();document.body.classList.remove('menu-open');}if(event.key==='Tab'&&document.querySelector('.modal')){const items=[...document.querySelectorAll('.modal button,.modal input,.modal textarea')].filter(el=>!el.disabled);if(event.shiftKey&&document.activeElement===items[0]){event.preventDefault();items.at(-1)?.focus();}else if(!event.shiftKey&&document.activeElement===items.at(-1)){event.preventDefault();items[0]?.focus();}}});
async function init() {
  const token=new URLSearchParams(location.search).get('invite');
  try {
    if(token){try{state.invite={...(await api(`/invites/${encodeURIComponent(token)}`)),token};renderAuth();return;}catch(error){toast(errorMessage(error));history.replaceState({},'',location.pathname);}}
    const {user}=await api('/me');state.user=user;if(user)await loadDashboard();else renderAuth();
  }catch(error){renderAuth();toast(errorMessage(error));}
}
let refreshing = false;
setInterval(async () => {
  if (!state.user || !state.data || document.hidden || document.querySelector('.modal') || refreshing) return;
  refreshing = true;
  try {
    const userId = state.user.id;
    const requestedDate = state.date;
    const requestGeneration = dashboardRequest;
    const previous = JSON.stringify(state.data);
    const result = await api(`/dashboard?date=${encodeURIComponent(requestedDate)}`);
    if (!state.user || state.user.id !== userId || state.date !== requestedDate ||
        dashboardRequest !== requestGeneration || document.querySelector('.modal')) return;
    if (JSON.stringify(result) !== previous) {
      state.data = result;
      if (!result.patients.some(p => p.id === state.selected)) state.selected = result.patients[0]?.id || null;
      renderContent();
    }
  } catch (_) { /* Manual actions surface errors; polling stays quiet. */ }
  finally { refreshing = false; }
}, 15000);
init();

</script>
</body>
</html>
